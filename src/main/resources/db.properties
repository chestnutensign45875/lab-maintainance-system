# =====================================================================
# Database Configuration for Lab Equipment System
# Supported values for db.type: AUTO, MYSQL, SQLITE
# When set to AUTO, the system attempts MySQL first, and gracefully
# falls back to embedded SQLite if MySQL server is not detected.
# =====================================================================

db.type=AUTO

# MySQL Configuration
mysql.host=localhost
mysql.port=3306
mysql.database=lab_db
mysql.user=root
mysql.password=root

# SQLite Configuration (Fallback / Standalone)
sqlite.path=lab_management.db
